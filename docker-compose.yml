services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brain_agent}
      MYSQL_USER: ${MYSQL_USER:-brain_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brain_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-brain_agent_root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-brain_agent_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-brain_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brain_agent}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brain_agent}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      BRAIN_AGENT_CREDENTIAL_ENCRYPTION_KEY: ${BRAIN_AGENT_CREDENTIAL_ENCRYPTION_KEY}
      DEFAULT_OWNER_ID: ${DEFAULT_OWNER_ID:-local-development-user}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      LOG_DIR: /app/logs
      PREPROCESSING_ROOT: /preprocessing
      PREPROCESSING_INPUT_ROOTS: '["/data"]'
      WORKFLOW_ROOT: /workflows
      WORKFLOW_INPUT_ROOTS: '["/data"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
      - preprocessing_data:/preprocessing
      - workflow_data:/workflows
      - ./data:/data:ro

  preprocessing-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["python", "-m", "app.preprocessing.worker", "--root", "/preprocessing", "--input-root", "/data", "--input-root", "/workflows"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
      - preprocessing_data:/preprocessing
      - workflow_data:/workflows
      - ./data:/data:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      FRONTEND_PORT: 5173
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data:
  preprocessing_data:
  workflow_data:
