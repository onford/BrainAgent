[project]
name = "brain-agent-backend"
version = "0.1.0"
description = "A lightweight, extensible multi-agent runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2,<1",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
eeg = [
  "mne==1.10.2", "mne-bids==0.17.0", "numpy==1.26.4",
  "scipy==1.15.3", "scikit-learn==1.6.1", "pandas==2.2.3",
  "asrpy==0.0.8", "torch==2.8.0+cpu",
  "pybv==0.7.6", "h5io==0.2.5", "h5py==3.13.0", "portalocker==3.2.0",
]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["app/preprocessing/units/source"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
